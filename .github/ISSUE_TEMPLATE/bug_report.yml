name: Bug report
description: Something in the app does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Suspect a security issue? Do not file it here; use the private
        [vulnerability report](https://github.com/bwhtech/helpdesk_mobile/security/advisories/new) instead.

        Redact your API key, secret, tokens and site URL from everything below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tickets
        2. Filter by team
        3. Pull to refresh
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings > About > Version.
      placeholder: 1.0.2
    validations:
      required: true
  - type: dropdown
    id: build-type
    attributes:
      label: Build type
      description: Settings > About > Build.
      options:
        - release
        - internal
        - debug
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Pixel 8
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "15"
    validations:
      required: true
  - type: input
    id: site-version
    attributes:
      label: Helpdesk and Frappe version
      description: On the site, Help > About lists the installed app versions.
      placeholder: Helpdesk 1.12.0, Frappe 15.60.0
    validations:
      required: true
  - type: dropdown
    id: sign-in-method
    attributes:
      label: Sign in method
      options:
        - API key and secret
        - OAuth
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: A logcat excerpt or a screenshot, if you have one.
      render: text
