name: twinrun drive

on:
  workflow_run:
    workflows: [twinrun]
    types: [completed]

permissions: {}

jobs:
  drive:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    uses: kaulith/twinrun/.github/workflows/drive.yml@19ad2c40e1d8bf71d911f5ed07332f56430daa48 # main
    permissions:
      actions: read
      contents: write
      pull-requests: write
