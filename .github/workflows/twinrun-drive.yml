name: twinrun drive

on:
  workflow_run:
    workflows: [twinrun]
    types: [completed]

permissions: {}

jobs:
  drive:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    uses: kaulith/twinrun/.github/workflows/drive.yml@15e703432a381e72c53ff4cad43791176bd95ba3 # main
    permissions:
      actions: read
      contents: write
      pull-requests: write
