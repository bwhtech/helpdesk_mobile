name: twinrun drive

on:
  workflow_run:
    workflows: [twinrun]
    types: [completed]

permissions: {}

jobs:
  drive:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    uses: kaulith/twinrun/.github/workflows/drive.yml@8cd3cb1b52a90eafcc477dea37e085b816291dd1 # main
    permissions:
      actions: read
      contents: write
      pull-requests: write
