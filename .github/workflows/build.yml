name: build

on:
  pull_request:
  push:
    branches: [main, develop, "version-*"]

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The real Firebase config is a release secret, and pull requests from
      # forks cannot read it. The sample carries the package name, which is all
      # the google-services plugin needs to generate resources for a debug build.
      - name: Use the sample Firebase config
        run: cp app/google-services.json.sample app/google-services.json

      - name: Build
        run: ./gradlew assembleDebug

      - name: Check the room schema is committed
        run: git diff --exit-code -- app/schemas

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Annotate test results
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: app/build/test-results/testDebugUnitTest/TEST-*.xml
          detailed_summary: true

      # Exercises the proguard rules, which the release tag would otherwise hit first.
      - name: Build the minified variant
        run: ./gradlew assembleInternal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html

  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Use the sample Firebase config
        run: cp app/google-services.json.sample app/google-services.json

      - name: Detekt
        run: ./gradlew detekt

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detekt-report
          path: app/build/reports/detekt/detekt.html
