complexity:
  ComplexCondition:
    threshold: 5
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable', 'FormUrlEncoded']
  TooManyFunctions:
    ignoreAnnotated: ['Composable']
    thresholdInClasses: 20

exceptions:
  TooGenericExceptionCaught:
    excludes: ['**/OAuthClient.kt']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    excludes: ['**/ui/**']
  ReturnCount:
    max: 4
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
